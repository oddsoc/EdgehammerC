[package]
name = "asjcc"
version = "0.1.0"
edition = "2024"

[features]
default = []
simd = []
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-tree"]

[dependencies]
unicode-ident = "1.0.24"
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
tracing-tree = { version = "0.4.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "tokeniser"
harness = false

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
codegen-units = 1
opt-level = 3
debug = false
lto = true

[profile.bench]
codegen-units = 1
opt-level = 3
debug = false
lto = true